<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 720" preserveAspectRatio="xMidYMid slice" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#ffffff" fill-opacity="0.10"/>
    </pattern>
  </defs>

  <rect width="1440" height="720" fill="url(#dots)"/>

  <!-- Abstract connected-network motif (management / collaboration) -->
  <g stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5" fill="none">
    <path d="M120 560 L360 420 L560 520 L820 300 L1080 440 L1320 260"/>
    <path d="M180 200 L420 320 L700 220 L980 360 L1240 300"/>
    <path d="M360 420 L420 320"/>
    <path d="M560 520 L700 220"/>
    <path d="M820 300 L980 360"/>
    <path d="M1080 440 L1240 300"/>
  </g>
  <g fill="#ffffff" fill-opacity="0.18">
    <circle cx="120" cy="560" r="4"/><circle cx="360" cy="420" r="5"/>
    <circle cx="560" cy="520" r="4"/><circle cx="820" cy="300" r="6"/>
    <circle cx="1080" cy="440" r="5"/><circle cx="1320" cy="260" r="4"/>
    <circle cx="180" cy="200" r="4"/><circle cx="420" cy="320" r="5"/>
    <circle cx="700" cy="220" r="6"/><circle cx="980" cy="360" r="5"/>
    <circle cx="1240" cy="300" r="4"/>
  </g>

  <circle cx="1180" cy="120" r="320" fill="url(#g)"/>
  <circle cx="120" cy="640" r="260" fill="url(#g)"/>
</svg>
